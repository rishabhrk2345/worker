# Temporal development dynamicconfig: everything enabled, no auth (local dev only)
# Referenced by infra/docker-compose.yml (temporal service).
#
# NOTE: Temporal auto-setup requires this file at
# /etc/temporal/config/dynamicconfig/development-sql.yaml

frontend.enableClientVersionCheck:
  - value: true
    constraints: {}

history.persistenceMaxQPS:
  - value: 3000
    constraints: {}

frontend.persistenceMaxQPS:
  - value: 2000
    constraints: {}

frontend.throttledLogRPS:
  - value: 20
    constraints: {}

history.historyMgrNumConns:
  - value: 50
    constraints: {}

system.advancedVisibilityWritingMode:
  - value: "off"
    constraints: {}

limit.maxIDLength:
  - value: 255
    constraints: {}

frontend.workflowArchivalDefault:
  - value: true
    constraints: {}
