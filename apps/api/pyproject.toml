[project]
name = "ai-marketing-os-api"
version = "2.0.0"
description = "Autonomous Multi-Product AI Marketing Workforce Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "temporalio>=1.33.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
